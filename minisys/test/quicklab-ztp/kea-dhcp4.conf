{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": ["eth0"]
    },
    "control-sockets": [
      {
        "socket-type": "http",
        "socket-address": "0.0.0.0",
        "socket-port": 8000
      }
    ],
    "lease-database": {
      "type": "memfile",
      "persist": false
    },
    "valid-lifetime": 3600,
    "subnet4": [
      {
        "id": 1,
        "subnet": "172.31.255.0/24",
        "pools": [
          { "pool": "172.31.255.100 - 172.31.255.149" }
        ],
        "option-data": [
          {
            "name": "routers",
            "data": "172.31.255.1"
          },
          {
            "comment": "Classic ZTP (IOS-XR): bootfile served by StratoWeave. This is subnet-global and hardcodes xrd1; a multi-device lab would use per-MAC host reservations so each device fetches its own /ztp/v1/device/<name>/bootfile (the per-device URL is the classic mechanism's identity).",
            "name": "boot-file-name",
            "data": "http://172.31.255.10/ztp/v1/device/xrd1/bootfile",
            "always-send": true
          },
          {
            "comment": "RFC 8572 SZTP redirect: StratoWeave bootstrap server. Kea encodes the RFC tuple format (2-byte length + URI) from this list. NOTE: advertises https but StratoWeave currently serves plain HTTP (TLS listener is future work); this exercises Kea option-143 encoding but a strict client following the redirect would need TLS. The lab sztp-agent uses an explicit http:// bootstrap-url and does not rely on this redirect.",
            "name": "v4-sztp-redirect",
            "code": 143,
            "data": "https://172.31.255.10",
            "always-send": true
          }
        ]
      }
    ],
    "loggers": [
      {
        "name": "kea-dhcp4",
        "output_options": [ { "output": "stdout" } ],
        "severity": "INFO"
      }
    ]
  }
}
